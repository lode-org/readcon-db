# Campaign-only Cargo config. Do not copy this into the published manifest.
#
# Cargo.toml keeps `readcon-core = "=0.21.0"`. That exact requirement cannot
# select 0.23.0, so Cargo ignores this patch until the campaign build
# temporarily requires `=0.23.0`, updates the lock, and restores both files.
#
#   bench/with-readcon-core-0.23.sh cargo test --lib
#   bench/with-readcon-core-0.23.sh maturin build --release --features python
#
# The git revision is the one recorded in bench/db3/hardware.json.
[patch.crates-io]
readcon-core = { git = "https://github.com/lode-org/readcon-core", rev = "f3ee0f471234e112209e6ad7623b2b6e5ce8a673" }
