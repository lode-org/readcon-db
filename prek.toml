# Git hooks via `prek` (https://prek.j178.dev).
# Install: `prek install`
# Run all: `prek run -a`
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.0"

exclude = """(?x)(
    ^docs/_build/|
    ^fortran/.*/build/|
    ^resources/test/|
    ^examples/benchmarks/|
    ^.*\\.svg$|
    ^.*\\.lock$
)"""

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
  { id = "check-case-conflict" },
  { id = "detect-private-key" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-ast" },
  { id = "debug-statements" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.2"
hooks = [
  { id = "ruff", args = ["--fix"], types_or = ["python"] },
  { id = "ruff-format", types_or = ["python"] },
]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"
hooks = [{ id = "taplo-format" }]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.1"
hooks = [
  {
    id = "codespell",
    args = [
      "--skip=*.lock,*.svg,*.con,*.convel,*.json,*.html,docs/_build",
      "-L",
      "crate,crates,nd,te,TE,ans,ro,RO,wit",
    ],
  },
]
