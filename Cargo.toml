[package]
name = "readcon-db"
version = "0.1.9"
edition = "2021"
description = "Mmap-backed CON frame corpus (Heed/LMDB), xxHash exact match, multi-language FFI"
license = "MIT"
repository = "https://github.com/lode-org/readcon-db"
homepage = "https://lode-org.github.io/readcon-db/"
documentation = "https://docs.rs/readcon-db"
rust-version = "1.88"
readme = "README.md"
keywords = ["con", "trajectory", "lmdb", "mmap", "molecular-dynamics"]
categories = ["database", "science", "api-bindings"]

[lib]
name = "readcon_db"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
python = ["dep:pyo3"]
capi = []
# Parallel ingest over a caller-supplied communicator (rsmpi). Needs an MPI
# implementation and libclang at build time. See src/mpi_ingest.rs.
mpi = ["dep:mpi"]

[dependencies]
heed = "0.21"
# The pinned writer provides exact numeric CON and JSON round trips.
# TODO: replace this git pin with crates.io `readcon-core = "=0.17.1"` once tag v0.17.1 is published.
readcon-core = { git = "https://github.com/lode-org/readcon-core", branch = "main", version = "=0.17.1" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", default-features = false }

pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
mpi = { version = "0.8", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
libc = "0.2"

[package.metadata.docs.rs]
all-features = false

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name = "readcon-db"
subdirectory = ""
generation = false

[package.metadata.capi.pkg_config]
name = "readcon-db"
filename = "readcon-db"
description = "Mmap-backed CON frame corpus (LMDB) with C/C++ FFI"

[package.metadata.capi.install.include]
asset = [
  { from = "include/readcon-db.h" },
  { from = "include/readcon-db-mpi.h" },
]

[[example]]
name = "bench_corpus_ops"
path = "examples/bench_corpus_ops.rs"

[[example]]
name = "mpi_ingest_check"
path = "examples/mpi_ingest_check.rs"
required-features = ["mpi"]

[[example]]
name = "mpi_read_check"
path = "examples/mpi_read_check.rs"
required-features = ["mpi"]

[[example]]
name = "shard_gate"
path = "examples/shard_gate.rs"
required-features = ["mpi"]
