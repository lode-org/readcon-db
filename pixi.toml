[workspace]
name = "readcon-db"
version = "0.1.8"
description = "Mmap-backed CON frame corpus (Heed/LMDB), xxHash exact match, multi-language FFI"
channels = ["conda-forge"]
platforms = ["linux-64"]

# docs-lock-refresh: keep lock in sync with CI --locked installs
[feature.docs]
dependencies = { python = "3.12.*", sphinx = ">=7,<9" }
[feature.docs.pypi-dependencies]
shibuya = ">=2026.1.9, <2027"
sphinx-copybutton = ">=0.5.2, <1"
sphinx-design = ">=0.6, <1"
myst-parser = ">=2"
[feature.docs.tasks]
docbld = { cmd = "bash scripts/build-docs.sh", description = "Org to rst, then Sphinx HTML" }
lock-refresh = { cmd = "pixi lock", description = "Refresh pixi.lock for locked docs installs" }

[environments]
docs = { features = ["docs"] }
