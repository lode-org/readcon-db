name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          locked: true
          environments: docs
      - name: Sphinx HTML
        run: pixi r -e docs docbld
      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.24.2
      - name: Link check (lychee)
        run: lychee --config lychee.toml 'docs/_build/html/**/*.html'
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -a website/. _site/
          mkdir -p _site/docs
          cp -a docs/_build/html/. _site/docs/
          cp -a assets _site/assets
          # Site-root objects.inv matches readcon-core intersphinx_mapping.
          cp docs/_build/html/objects.inv _site/objects.inv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
