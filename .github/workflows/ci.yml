name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Python headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Test (locked)
        run: cargo test --locked --all-targets
      - name: Test with the C ABI (capi)
        run: cargo test --locked --all-targets --features capi
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Clippy with the C ABI (capi)
        run: cargo clippy --locked --all-targets --features capi
      - name: Docs
        run: cargo doc --locked --no-deps
      - name: Verify registry package
        run: cargo package --locked
