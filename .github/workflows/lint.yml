name: Lint

on:
  push:
    branches: [main, "fix/**", "feat/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Conventional commits check
      uses: cocogitto/cocogitto-action@v3
      with:
        check-latest-tag-only: true

    # large-file-auditor is omitted: this clone already has historical
    # target/debug blobs above 1M. Rewriting shared history is a separate job.

  version:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - run: python -m pip install cogapp==3.6.0 meson==1.12.1

    - name: Every version copy matches Cargo.toml
      run: python scripts/check_version_lockstep.py

    - name: Drift the sync misses still fails the check
      run: python scripts/test_check_version_lockstep.py

    - name: The sync leaves the tree unchanged
      run: |
        python scripts/sync-version.py
        git diff --exit-code
