name: cxx source tarball

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cxx-tarball:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Assemble cxx tarball
        run: |
          mkdir -p dist-cxx
          bash scripts/package-cxx.sh dist-cxx --vendor
          ls -lh dist-cxx

      - name: Upload tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-cxx/readcon-db-cxx-*.tar.gz
            dist-cxx/readcon-db-cxx-*.tar.gz.sha256
          fail_on_unmatched_files: true
          append_body: true
          body: |
            C/C++ source tarball (`readcon-db-cxx-*.tar.gz`) for CMake FetchContent and Meson wrap. Headers are shipped; cbindgen is not required.
