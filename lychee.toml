# Link checker for the assembled Pages tree (landing + Sphinx).
# Run: scripts/assemble-site.sh && lychee --config lychee.toml '_site/**/*.html'
# CI: after pixi r -e docs docbld && scripts/assemble-site.sh

verbose = "info"
no_progress = true
max_concurrency = 8
include_mail = false

accept = ["100..=103", "200..=299", "403", "429"]

exclude = [
  '^https?://fonts\.gstatic\.com/',
  '^https?://fonts\.googleapis\.com/',
  # Live Pages lag behind main until deploy; CI checks the local _site artifact.
  '^https://lode-org\.github\.io/readcon-db/',
  '^https://lode-org\.github\.io/readcon-core/',
  # Edit-this-page targets main; CI/PR runs before merge so blobs 404.
  '^https://github\.com/lode-org/readcon-db/blob/',
  # clib assets attach via c_lib_tarball.yml after this lands.
  '^https://github\.com/lode-org/readcon-db/releases/download/.*/readcon-db-clib-',
]

exclude_path = [
  "_site/docs/_static/.*",
  "_site/docs/searchindex.js",
]
